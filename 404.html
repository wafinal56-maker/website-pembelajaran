<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halaman tidak ditemukan — SMK Creative Hub</title>
<style>
:root{--navy:#123b50;--teal:#0f766e;--bg:#f3f6f8;--ink:#172b3a;--muted:#617383;--line:#dce5eb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(900px 420px at 80% -10%,#d9f2ee,transparent 60%),var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:40px;text-align:center;box-shadow:0 24px 50px -28px rgba(18,59,80,.5)}
.code{font:800 4rem/1 Consolas,monospace;color:var(--teal);letter-spacing:-.05em;margin:0 0 10px}
h1{font-size:1.5rem;color:var(--navy);margin:0 0 10px}
p{color:var(--muted);margin:0 0 24px}
a{display:inline-block;background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:11px}
a:hover{transform:translateY(-1px)}
</style>
</head>
<body>
  <main class="card">
    <p class="code">404</p>
    <h1>Halaman tidak ditemukan</h1>
    <p>Alamat yang kamu buka mungkin salah atau sudah dipindahkan.</p>
    <a href="/website-pembelajaran/">Kembali ke beranda</a>
  </main>
</body>
</html>
